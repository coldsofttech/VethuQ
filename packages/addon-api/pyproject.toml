[project]
name = "vethuq-addon-api"
dynamic = ["version"]
description = "The contract between VethuQ and its add-ons: the Addon base class, hooks and host."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vethuq_addon_api"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
fallback_version = "0.1.0"
tag_regex = "^vethuq-addon-api-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "vethuq-addon-api-v*"]
