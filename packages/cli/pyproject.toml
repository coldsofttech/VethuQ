[project]
name = "vethuq-cli"
dynamic = ["version"]
description = "VethuQ command-line interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "vethuq",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
vethuq = "vethuq_cli.main:Cli.run"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vethuq_cli"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# This package lives in a subdirectory of the repo, not at its root.
root = "../.."
# Released on its own with tags `vethuq-cli-vX.Y.Z` (or `vethuq-cli-vX.Y.Z-rcN`), independent of the
# other packages. Only this package's tags count. With no tag yet the version is 0.1.0.
fallback_version = "0.1.0"
tag_regex = "^vethuq-cli-v(?P<version>\\d+\\.\\d+\\.\\d+(?:-?rc\\d+)?)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "vethuq-cli-v*"]

[tool.uv.sources]
vethuq = { workspace = true }
