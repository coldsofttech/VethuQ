[project]
name = "vethuq-ui"
dynamic = ["version"]
description = "VethuQ desktop UI (Tkinter)"
requires-python = ">=3.11"
dependencies = [
    "vethuq-core",
    "pillow",
    "sv-ttk",
]

[project.scripts]
vethuq-ui = "vethuq_ui.app:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vethuq_ui"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# This package lives in a subdirectory of the repo, not at its root.
root = "../.."
# Released on its own with tags `ui-vX.Y.Z` (or `ui-vX.Y.Z-dev.N`), independent of the
# other packages and of the `v*` / `desktop-v*` tags. Only this package's tags count.
tag_regex = "^ui-v(?P<version>\\d+\\.\\d+\\.\\d+(-dev\\.\\d+)?)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "ui-v*"]
