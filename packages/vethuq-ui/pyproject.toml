[project]
name = "vethuq-ui"
version = "0.1.0"
description = "VethuQ desktop UI (Tkinter)"
requires-python = ">=3.11"
dependencies = [
    "vethuq-core",
]

[project.scripts]
vethuq-ui = "vethuq_ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vethuq_ui"]
