[project]
name = "vethuq-core"
version = "0.1.0"
description = "VethuQ core engine — document model, ingest, OCR, indexing, and search (the Free-tier foundation used by every higher tier)"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.0",
    "paddlepaddle>=2.6",
    "paddleocr>=2.8",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vethuq_core"]
