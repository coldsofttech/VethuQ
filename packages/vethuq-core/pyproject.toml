[project]
name = "vethuq-core"
version = "0.1.0"
description = "VethuQ core engine — document model, ingest, OCR, indexing, and search (the Free-tier foundation used by every higher tier)"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.0",
    # Paddle merged CPU/GPU into a single `paddlepaddle` package from 3.0
    # onward (the separate `paddlepaddle-gpu` PyPI package was never updated
    # past 2.6.2). This PyPI build is CPU-only; a GPU-enabled build has to be
    # installed separately from Paddle's own package index - it runs CPU-only
    # fine either way (paddle.device.get_device() reports 'cpu' automatically
    # without one) - see `vethuq_core.ocr.Engine.resolve_device` for the opt-in GPU
    # setting on top.
    "paddlepaddle>=3.0",
    "paddleocr>=3.0",
    "pymupdf>=1.24",
    # Extracts text from `.html`/`.htm`/`.xhtml` files and decodes their (often
    # undeclared) character encoding - see `vethuq_core.ocr.Markup`. Pure Python, using
    # the stdlib `html.parser` rather than `lxml`, so no native-build risk alongside
    # paddle's pinned opencv.
    "beautifulsoup4>=4.12",
    # Better encoding detection for `UnicodeDammit` above when a file declares none.
    "charset-normalizer>=3.0",
    # Parses `.xml` files without the stdlib parser's entity-expansion (billion-laughs)
    # and external-entity weaknesses. Pure Python.
    "defusedxml>=0.7",
    # No explicit opencv dependency here on purpose: `paddleocr` pulls in
    # `paddlex`, which hard-pins an exact `opencv-contrib-python` version.
    # Also declaring our own `opencv-python-headless` installs a second,
    # different-version `cv2` native build into the same site-packages path,
    # which corrupts both and crashes Paddle's inference calls with a native
    # access violation - so `cv2` here is provided solely by paddlex's pin.
    "numpy>=1.26",
    "psutil>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vethuq_core"]
