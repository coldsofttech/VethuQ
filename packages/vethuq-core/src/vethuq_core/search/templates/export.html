<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>{{APP_NAME}} search export: {{QUERY_TEXT}}</title>
<style>
{{PALETTE}}
{{STYLE}}
</style>
</head>
<body>
<h1>Search export: {{QUERY}}</h1>
<p class="meta">{{RESULT_COUNT}} match(es){{SEARCH_MODE}} &middot; generated {{GENERATED_AT}}</p>
<div class="results">
  <div class="row-cells header">
    <span></span>
    <span>File Name</span>
    <span>File Path</span>
    <span>Page</span>
    <span>Total Pages</span>
    <span>Match</span>
  </div>
  {{ROWS}}
</div>
<footer>
  <div class="footer-title">Generated by {{APP_NAME}}</div>
  <div class="footer-subtitle">{{APP_TAGLINE}}</div>
</footer>
</body>
</html>
