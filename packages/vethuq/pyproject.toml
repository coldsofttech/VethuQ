[project]
name = "vethuq"
description = "VethuQ — document intelligence and evidence infrastructure. Library and CLI."
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "platformdirs>=4.0",
    "paddlepaddle>=3.0",
    "paddleocr>=3.0",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.0",
    "defusedxml>=0.7",
    "numpy>=1.26",
    "psutil>=5.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
vethuq = "vethuq._cli.main:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# This package lives in a subdirectory of the repo, not at its root.
root = "../.."
# Tags are `vX.Y.Z` (stable) or `vX.Y.Z-dev.N` (prerelease); hatch-vcs/
# setuptools-scm want dots, not hyphens, before a prerelease segment.
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+(-dev\\.\\d+)?)$"

[tool.hatch.build.targets.wheel]
packages = ["src/vethuq"]
