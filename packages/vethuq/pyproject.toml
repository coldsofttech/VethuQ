[project]
name = "vethuq"
description = "VethuQ — document intelligence and evidence infrastructure. Library and CLI."
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "platformdirs>=4.0",
    "paddlepaddle>=3.0",
    "paddleocr>=3.0",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "psutil>=5.9",
    "typer>=0.12",
    "rich>=13.7",
]

# BEGIN generated from the manifests - run scripts/dev/sync_extras.py
[project.optional-dependencies]
lang-en = []
ocr-paddle = ["paddleocr>=3.0"]
search-exact = ["vethuq-search-exact"]
search-full-text = ["vethuq-search-full-text"]
search-fuzzy = ["vethuq-search-fuzzy"]
search-lexical = ["vethuq-search-lexical"]
search-like = []
search-noise-fuzzy = ["vethuq-search-noise-fuzzy"]
search-proximity = ["vethuq-search-proximity"]
type-jpg = ["vethuq-type-jpg"]
type-pdf = ["pymupdf>=1.24"]
type-png = ["vethuq-type-png"]
# END generated

[project.scripts]
vethuq = "vethuq._cli.main:Cli.run"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# This package lives in a subdirectory of the repo, not at its root.
root = "../.."
# Tags are `vX.Y.Z` (stable) or `vX.Y.Z-dev.N` (prerelease); hatch-vcs/
# setuptools-scm want dots, not hyphens, before a prerelease segment.
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+(-dev\\.\\d+)?)$"

[tool.hatch.build.targets.wheel]
packages = ["src/vethuq"]
