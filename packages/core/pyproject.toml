[project]
name = "VethuQ"
dynamic = ["version"]
description = "VethuQ — open-source document intelligence and evidence infrastructure for search, retrieval, structure, metadata, relationships, and AI-ready document access."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platformdirs~=4.0",
    "cryptography~=50.0",
    "packaging~=26.0",
    "sqlalchemy~=2.0",
    "vethuq-addon-api~=0.1",
    "vethuq-addon-english~=0.1",
    "vethuq-addon-pdf~=0.1",
    "vethuq-addon-txt~=0.1",
    "vethuq-addon-csv~=0.1",
    "vethuq-addon-markdown~=0.1",
    "vethuq-addon-paddle~=0.1",
    "vethuq-addon-ocr-quick~=0.1",
    "vethuq-addon-like~=0.1",
    "vethuq-addon-exact~=0.1",
    "vethuq-addon-lexical~=0.1",
    "vethuq-addon-full-text~=0.1",
    "vethuq-addon-proximity~=0.1",
    "vethuq-addon-fuzzy~=0.1",
    "vethuq-addon-noise-fuzzy~=0.1",
    "vethuq-addon-case~=0.1",
    "vethuq-addon-unicode~=0.1",
    "vethuq-addon-leetspeak~=0.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Run OCR in your own GitHub account (a free add-on).
github = ["vethuq-addon-github~=0.1"]
# Search by meaning (a free add-on; preparing pages costs credits). Brings ONNX Runtime.
semantic = ["vethuq-addon-semantic~=0.1"]
# Read image files (PNG, JPG, TIFF) and the pictures Markdown files link to: the image bundle, which
# installs the three free image add-ons.
images = ["vethuq-bundle-image~=0.1"]
# The deeper OCR phases, moderate and deep (quick is installed with VethuQ): `vethuq-bundle-deep-scan`.
deep-scan = ["vethuq-bundle-deep-scan~=0.1"]
# The web file types (HTML, XML, CSS, JavaScript, JSON; licensed): `vethuq-bundle-web`.
web = ["vethuq-bundle-web~=0.1"]
# The developer file types (YAML, JSON; licensed): `vethuq-bundle-developer`.
developer = ["vethuq-bundle-developer~=0.1"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vethuq"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# This package lives in a subdirectory of the repo, not at its root.
root = "../.."
# Versions come from git tags `vethuq-vX.Y.Z`; with no tag yet the version is 0.1.0.
fallback_version = "0.1.0"
tag_regex = "^vethuq-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "vethuq-v*"]
