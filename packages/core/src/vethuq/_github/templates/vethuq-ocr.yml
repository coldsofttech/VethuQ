# VethuQ OCR caller. Written by `client.github.setup()` and rewritten by `client.github.update()`;
# edit nothing here: the limits, licences and add-ons that apply come from the encrypted job
# manifest and are enforced inside the worker, so changing this file changes nothing about them.
name: vethuq-ocr

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id (set by VethuQ)"
        required: true
        type: string
      asset:
        description: "Payload asset reference (set by VethuQ)"
        required: true
        type: string

concurrency:
  group: vethuq-ocr-${{ inputs.job_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ocr:
    uses: coldsofttech/VethuQ/.github/workflows/github-ocr.yml@__WORKFLOW_REF__
    with:
      job_id: ${{ inputs.job_id }}
      asset: ${{ inputs.asset }}
      image: __IMAGE__
    secrets:
      master_key: ${{ secrets.VETHUQ_MASTER_KEY }}
