[project]
name = "vethuq-cli"
version = "0.1.0"
description = "VethuQ command-line interface"
requires-python = ">=3.11"
dependencies = [
    "vethuq-core",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
vethuq = "vethuq_cli.main:Cli.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vethuq_cli"]
