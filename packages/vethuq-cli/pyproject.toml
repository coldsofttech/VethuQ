[project]
name = "vethuq-cli"
dynamic = ["version"]
description = "VethuQ command-line interface"
requires-python = ">=3.11"
dependencies = [
    "vethuq-core",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
vethuq = "vethuq_cli.main:Cli.run"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vethuq_cli"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# This package lives in a subdirectory of the repo, not at its root.
root = "../.."
# Released on its own with tags `cli-vX.Y.Z` (or `cli-vX.Y.Z-dev.N`), independent of the
# other packages and of the `v*` / `desktop-v*` tags. Only this package's tags count.
tag_regex = "^cli-v(?P<version>\\d+\\.\\d+\\.\\d+(-dev\\.\\d+)?)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "cli-v*"]
