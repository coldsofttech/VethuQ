[project]
name = "vethuq-desktop"
dynamic = ["version"]
description = "VethuQ desktop application: starts the local API and opens it in a native window (Windows, WebView2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "vethuq-api",
    "pywebview>=6.0",
]

[project.scripts]
vethuq-desktop = "vethuq_desktop.launcher:main"

[project.gui-scripts]
vethuq-desktop-gui = "vethuq_desktop.launcher:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vethuq_desktop"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# This package lives in a subdirectory of the repo, not at its root.
root = "../.."
# Released on its own with tags `vethuq-desktop-vX.Y.Z` (or `-rcN`). With no tag yet the version is 0.1.0.
fallback_version = "0.1.0"
tag_regex = "^vethuq-desktop-v(?P<version>\\d+\\.\\d+\\.\\d+(?:-?rc\\d+)?)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "vethuq-desktop-v*"]

[tool.uv.sources]
vethuq-api = { workspace = true }
