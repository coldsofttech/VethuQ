[project]
name = "vethuq-worker"
dynamic = ["version"]
description = "The VethuQ job protocol (v1) and the worker that reads a job's pages on a GitHub runner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography~=50.0",
    "jsonschema>=4.20",
    "vethuq-addon-api~=0.1",
]

[project.optional-dependencies]
# What the worker needs to actually read pages (the image installs it); clients that only build
# jobs and read results need just the base dependencies plus Pillow/numpy for images.
images = ["pillow>=10", "numpy>=1.26"]
run = ["VethuQ", "pillow>=10", "numpy>=1.26"]

[project.scripts]
vethuq-worker = "vethuq_worker.cli:WorkerCli.main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vethuq_worker"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
fallback_version = "0.1.0"
tag_regex = "^vethuq-worker-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "vethuq-worker-v*"]
