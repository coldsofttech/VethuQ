name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Merge vethuq-core/vethuq-cli into packages/vethuq
        run: uv run python packages/vethuq/scripts/merge_sources.py

      - name: Run tests
        shell: bash
        env:
          # Coverage is measured on one leg only - it slows every job down and
          # the report is the same regardless of OS/Python version.
          COV_ARGS: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && '--cov --cov-report=xml' || '' }}
        run: |
          set +e
          uv run pytest -n auto $COV_ARGS
          code=$?
          # pytest exits 5 when no tests were collected — not a failure this early in the project.
          if [ $code -eq 5 ]; then
            echo "No tests collected yet, skipping."
            exit 0
          fi
          exit $code
