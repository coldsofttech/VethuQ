# Builds the worker image (github/image/Dockerfile) and publishes it to GHCR as a public package.
#
# The image holds the premium add-ons' compiled wheels, so the build checks out the private
# repositories with PREMIUM_READ_TOKEN (a fine-grained token with read-only Contents access to
# VethuQ-premium and VethuQ-entitlements) and then gates every wheel for shipping. Nothing from
# those repositories is logged or uploaded except as compiled wheels inside the image.
#
# It prints a compatibility row for the job summary; a person adds it to
# the compatibility table in VethuQ-premium (packages/add-ons/tiers/github/src/vethuq_addon_github/_compat.py);
# rows are never rewritten by automation.
name: github-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, X.Y.Z (the image tag; matches a github-tier-vX.Y.Z workflow tag)"
        required: true
        type: string
      push:
        description: "Publish the image (off: build and smoke-test only)"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "worker-image-v*"
  pull_request:
    paths:
      - "github/image/**"
      - ".github/workflows/github-image.yml"
      - "packages/worker/**"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/coldsofttech/vethuq-worker
  # Premium add-ons the image carries (folders under VethuQ-premium/packages/add-ons; a grouped add-on's
  # folder includes its group, for example search/engines/like). These are the free add-ons VethuQ
  # itself depends on, and the three OCR phases (quick, moderate, deep: the worker reads rotated
  # images with the server models these bake in). Not here: backup (licensed, not part of reading pages) and github (the tier
  # that sends jobs to this image).
  PREMIUM_ADDONS: >-
    languages/english languages/telugu languages/hindi languages/urdu languages/french languages/spanish
    file-types/pdf file-types/txt file-types/csv file-types/tsv file-types/markdown
    file-types/png file-types/jpg file-types/tiff file-types/bmp file-types/gif file-types/webp file-types/jp2 file-types/svg file-types/heic
    file-types/html file-types/mhtml file-types/xml file-types/rss file-types/css file-types/js file-types/json file-types/yaml file-types/toml file-types/py file-types/java file-types/ts file-types/tsx file-types/jsx file-types/cs file-types/go file-types/rs file-types/php file-types/rb file-types/sh file-types/ps1 file-types/ipynb file-types/ini file-types/sql file-types/rst file-types/log file-types/ndjson file-types/parquet
    file-types/docx file-types/doc file-types/xlsx file-types/xls file-types/pptx file-types/ppt file-types/odt file-types/ott file-types/ods file-types/ots file-types/odp file-types/otp file-types/dot file-types/dotx file-types/xlsm file-types/xlsb file-types/pptm file-types/pps file-types/ppsx
    file-types/rtf file-types/eml file-types/msg
    ocr/engines/paddle ocr/modes/quick ocr/modes/moderate ocr/modes/deep
    search/engines/like search/engines/exact search/engines/lexical search/engines/full-text
    search/engines/proximity search/engines/fuzzy search/engines/noise-fuzzy search/engines/semantic
    autoscale
    search/normalisers/case search/normalisers/unicode search/normalisers/leetspeak

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (cosign) and the provenance attestation
      attestations: write
    steps:
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            workflow_dispatch) version="$INPUT_VERSION" ;;
            push) version="${REF_NAME#worker-image-v}" ;;
            *) version="0.0.0-pr" ;;
          esac
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-pr)?$ ]] || { echo "bad version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The three repositories sit side by side, as the workspaces' path sources expect.
      - uses: actions/checkout@v4
        with:
          path: work/VethuQ
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          repository: coldsofttech/VethuQ-premium
          token: ${{ secrets.PREMIUM_READ_TOKEN }}
          path: work/VethuQ-premium
          persist-credentials: false
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          repository: coldsofttech/VethuQ-entitlements
          token: ${{ secrets.PREMIUM_READ_TOKEN }}
          path: work/VethuQ-entitlements
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and gate the wheels
        working-directory: work
        run: |
          python -m pip install build setuptools wheel "Cython>=3.0"
          mkdir -p context/wheels context/lists
          cp VethuQ/github/image/Dockerfile VethuQ/github/image/slim.py context/
          for package in VethuQ/packages/addon-api VethuQ/packages/core VethuQ/packages/worker \
                         VethuQ-entitlements/packages/entitlements; do
            python -m build --wheel --outdir context/wheels "$package"
          done
          for addon in $PREMIUM_ADDONS; do
            python -m build --wheel --outdir context/wheels "VethuQ-premium/packages/add-ons/$addon"
          done
          python VethuQ-premium/scripts/add-ons/wheel_gate.py --wheel context/wheels/vethuq_addon_*.whl
          # The administration package must never ship.
          if ls context/wheels | grep -qi admin; then echo "admin wheel present"; exit 1; fi
          ls -l context/wheels

      # The variants are defined once, in the worker package (vethuq_worker/variants.py). The file
      # uses only the standard library, so it is run as it is.
      - name: Write the add-on lists of the variants
        working-directory: work
        run: |
          variants="VethuQ/packages/worker/src/vethuq_worker/variants.py"
          python "$variants" --list slim > context/lists/base.txt
          for variant in $(python "$variants" --names); do
            python "$variants" --extra "$variant" > "context/lists/$variant.txt"
          done
          # Every add-on the variants name has a wheel in the context.
          python "$variants" --all-addons | while read -r addon; do
            ls context/wheels | grep -qi "^${addon//-/_}-" || { echo "no wheel for $addon"; exit 1; }
          done
          wc -l context/lists/*.txt

      - uses: docker/setup-buildx-action@v3

      # One builder builds every variant, so the layers of the shared base are built once.
      - name: Build and smoke-test every variant
        id: build
        working-directory: work
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          variants="VethuQ/packages/worker/src/vethuq_worker/variants.py"
          {
            echo "### Image variants"
            echo
            echo "| Variant | Uncompressed size | Layers |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for variant in $(python "$variants" --names); do
            echo "::group::$variant"
            docker buildx build context --load --build-arg "VARIANT=$variant" \
              --tag "$IMAGE:candidate-$variant"
            VethuQ/github/image/smoke.sh "$IMAGE:candidate-$variant" \
              "$PWD/VethuQ/github/protocol/v1/fixtures" "$RUNNER_TEMP/smoke-$variant"
            size="$(docker image inspect -f '{{.Size}}' "$IMAGE:candidate-$variant")"
            layers="$(docker image inspect -f '{{len .RootFS.Layers}}' "$IMAGE:candidate-$variant")"
            echo "| $variant | $((size / 1024 / 1024)) MB | $layers |" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      # Known vulnerabilities in what each image carries. Publication needs a clean result for
      # CRITICAL findings that have a fix (the agreed severity: raise or lower it here).
      - name: Scan every variant for vulnerabilities
        run: |
          variants="work/VethuQ/packages/worker/src/vethuq_worker/variants.py"
          for variant in $(python "$variants" --names); do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.1 image --quiet --exit-code 1 --severity CRITICAL --ignore-unfixed \
              "$IMAGE:candidate-$variant"
          done

      - name: Publish
        id: publish
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The layers were just built, so this is the build cache again, pushed with zstd compression.
      # `full` is also the plain version tag, the one the first compatibility rows name.
      - name: Push
        id: push
        if: steps.publish.outcome == 'success'
        working-directory: work
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          variants="VethuQ/packages/worker/src/vethuq_worker/variants.py"
          : > "$RUNNER_TEMP/rows.jsonl"
          for variant in $(python "$variants" --names); do
            tags=(--tag "$IMAGE:$VERSION-$variant")
            [ "$variant" = full ] && tags+=(--tag "$IMAGE:$VERSION")
            docker buildx build context --build-arg "VARIANT=$variant" "${tags[@]}" \
              --metadata-file "$RUNNER_TEMP/meta-$variant.json" \
              --output "type=image,push=true,compression=zstd,compression-level=19,force-compression=true,oci-mediatypes=true"
            digest="$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['containerimage.digest'])" "$RUNNER_TEMP/meta-$variant.json")"
            echo "{\"variant\": \"$variant\", \"image\": \"$IMAGE:$VERSION-$variant@$digest\"}" \
              >> "$RUNNER_TEMP/rows.jsonl"
          done

      # Signed with the workflow's own identity (no key to keep), with an SBOM and a build
      # provenance attestation attached to each digest; how to check them is in github/image/README.md.
      - uses: sigstore/cosign-installer@v3.7.0
        if: steps.push.outcome == 'success'

      - name: Sign every variant and make its SBOM
        if: steps.push.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/sboms"
          while read -r line; do
            image="$(python -c "import json,sys; print(json.loads(sys.argv[1])['image'])" "$line")"
            variant="$(python -c "import json,sys; print(json.loads(sys.argv[1])['variant'])" "$line")"
            cosign sign --yes "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.18.1 \
              "$image" -o spdx-json > "$RUNNER_TEMP/sboms/sbom-$variant.spdx.json"
            cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/sboms/sbom-$variant.spdx.json" "$image"
          done < "$RUNNER_TEMP/rows.jsonl"

      - name: Attest the build provenance (full)
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.full }}
          push-to-registry: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.push.outcome == 'success'
        with:
          name: worker-image-sbom
          path: ${{ runner.temp }}/sboms
          retention-days: 90

      - name: The digest of the full image
        id: digest
        if: steps.push.outcome == 'success'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          for line in open(os.path.join(os.environ["RUNNER_TEMP"], "rows.jsonl")):
              row = json.loads(line)
              if row["variant"] == "full":
                  print("full=" + row["image"].split("@")[1])
          PY

      - name: Compatibility row
        if: steps.push.outcome == 'success'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Add this row to the compatibility table (vethuq_addon_github/_compat.py)"
            echo
            echo "One row per release: the worker image of every variant, by name. \`full\` is also the"
            echo "row's own \`image\`."
            echo
            echo '```json'
            python - <<'PY'
          import json, os
          version = os.environ["VERSION"]
          images = {}
          for line in open(os.path.join(os.environ["RUNNER_TEMP"], "rows.jsonl")):
              row = json.loads(line)
              images[row["variant"]] = row["image"]
          print(json.dumps({
              "workflow_ref": f"github-tier-v{version}",
              "image": images["full"],
              "variants": images,
              "protocol": 1,
              "min_client": version,
              "status": "current",
          }, indent=2))
          PY
            echo '```'
            echo
            echo "Make the package public in the GitHub package settings the first time."
          } >> "$GITHUB_STEP_SUMMARY"
