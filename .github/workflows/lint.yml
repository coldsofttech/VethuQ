# Lints the core repository. Needs no private checkouts, so it also runs for fork PRs.
name: lint

on:
  push:
    branches: [main, feat/new-feature]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: ruff check
        run: uvx ruff@0.6.9 check .
      - name: ruff format
        run: uvx ruff@0.6.9 format --check .
