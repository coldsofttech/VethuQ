name: metrics-collector

# Tests the metrics collector on every change, and deploys it to Cloudflare when asked (run the
# workflow by hand and tick "deploy") or when a change to it reaches the default branch.
#
# One-time setup (see metrics/collector/README.md):
#   1. Create the D1 database:  npx wrangler d1 create vethuq-metrics
#   2. In the repository settings, add the secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit,
#      D1: Edit) and CLOUDFLARE_ACCOUNT_ID, and the variable CLOUDFLARE_D1_DATABASE_ID.
#   3. Create an environment called "metrics-collector" (add required reviewers if you want an
#      approval before each deploy). Secrets are only given to the deploy job.

on:
  push:
    paths:
      - "metrics/**"
      - ".github/workflows/metrics-collector.yml"
  pull_request:
    paths:
      - "metrics/**"
      - ".github/workflows/metrics-collector.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare after the tests pass"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: metrics/collector/package-lock.json
      - name: Install
        working-directory: metrics/collector
        run: npm ci
      - name: Test
        working-directory: metrics/collector
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The Python client and the schema agree
        run: |
          pip install jsonschema
          python metrics/schema/check.py

  deploy:
    needs: test
    # Forks and pull requests never deploy; only a push to the default branch or a manual run.
    if: >-
      github.repository_owner == 'coldsofttech' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
       (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    environment: metrics-collector
    concurrency:
      group: metrics-collector-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: metrics/collector/package-lock.json
      - name: Install
        working-directory: metrics/collector
        run: npm ci
      - name: Point wrangler.toml at the database
        working-directory: metrics/collector
        env:
          D1_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$D1_ID" || { echo "Set the CLOUDFLARE_D1_DATABASE_ID variable"; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"${D1_ID}\"/" wrangler.toml
      - name: Apply database migrations
        working-directory: metrics/collector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply vethuq-metrics --remote
      - name: Deploy
        working-directory: metrics/collector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
