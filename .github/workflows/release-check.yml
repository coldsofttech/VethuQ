name: Release checks

on:
  pull_request:
  push:
    branches: [main, "dev/v*"]

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Build vethuq package
        run: uv run python scripts/dev/release.py --package

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --group dev --group desktop

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build VethuQ Desktop installer
        run: uv run python scripts/dev/release.py --desktop
