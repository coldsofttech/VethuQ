name: Release checks

on:
  pull_request:
  push:
    branches: [main, "dev/v*"]

jobs:
  # Cheap, OS-agnostic sanity check (merge_sources.py + build the wheel/sdist)
  # that runs on every PR - vethuq is a pure-Python package (see
  # packages/vethuq/pyproject.toml), so one OS is enough signal that
  # packaging itself isn't broken; Windows runtime behavior is already
  # covered by test.yml's windows-latest matrix on every PR too.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Build vethuq package
        run: uv run python scripts/dev/release.py --package

  # Full PyInstaller + Inno Setup build - the expensive part (~most of this
  # workflow's runtime). Not worth paying on every PR; runs after a PR
  # merges to main/dev/v*, giving a release-ready branch a real build check
  # before anyone actually cuts a `desktop-v*` tag off it.
  desktop:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --group dev --group desktop

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build VethuQ Desktop installer
        run: uv run python scripts/dev/release.py --desktop
