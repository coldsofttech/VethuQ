# Builds the VethuQ command-line installers when `vethuq-cli-vX.Y.Z` is pushed:
#
#   Windows   VethuQ-CLI-Setup.exe             PyInstaller + Inno Setup
#   Linux     vethuq-cli_X.Y.Z_amd64.deb       PyInstaller + dpkg-deb
#
# Only the command line (no UI, no background service; the interactive shell has its own workflow,
# release-interactive-cli.yml, though the same build holds both programs). Add `-rcN` for a
# release candidate: it is attached to a GitHub prerelease. Nothing goes to PyPI. The free add-ons
# come from the sibling VethuQ-premium checkout, and the compiled `vethuq_entitlements` runtime from
# the private VethuQ-entitlements release pinned in packages/core/ENTITLEMENTS_VERSION (both read
# with PREMIUM_READ_TOKEN, as in release.yml). See docs/releasing.md.
name: release-cli

on:
  push:
    tags:
      - "vethuq-cli-v*"

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install packaging
      - id: plan
        run: python scripts/release/plan.py "$GITHUB_REF_NAME"
      - id: version
        run: echo "version=${GITHUB_REF_NAME#vethuq-cli-v}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: cli-windows
          # The oldest Ubuntu runner: a binary needs a glibc at least as new as the one it was built on.
          - os: ubuntu-22.04
            artifact: cli-linux
    runs-on: ${{ matrix.os }}
    steps:
      # The three repositories sit side by side, as the workspace's path sources expect.
      - uses: actions/checkout@v4
        with:
          path: work/VethuQ
          fetch-depth: 0 # hatch-vcs reads the tag
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: coldsofttech/VethuQ-premium
          path: work/VethuQ-premium
          token: ${{ secrets.PREMIUM_READ_TOKEN }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install the command line and the default add-ons
        working-directory: work/VethuQ
        shell: bash
        run: uv sync --package vethuq-cli --package vethuq-interactive-cli --package vethuq-background --package vethuq-worker --package vethuq-desktop --no-dev
          uv pip install "pyinstaller>=6.10"
      - name: Install the compiled entitlements runtime
        working-directory: work/VethuQ
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PREMIUM_READ_TOKEN }}
        run: |
          version="$(tr -d '[:space:]' < packages/core/ENTITLEMENTS_VERSION)"
          gh release download "vethuq-entitlements-v${version}" \
            --repo coldsofttech/VethuQ-entitlements --dir entitlements
          (cd entitlements && sha256sum --check SHA256SUMS)
          uv pip install --no-deps --find-links entitlements vethuq-entitlements
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Embed the production policy keys and refuse a build with test keys
        working-directory: work/VethuQ
        shell: bash
        run: |
          python scripts/release/embed_policy.py --flavour production --keys-dir policy/keys
          python scripts/release/check_embedded.py

      - name: Build the installer
        working-directory: work/VethuQ
        shell: bash
        run: uv run --no-sync python scripts/release/release.py --cli --version "${{ needs.plan.outputs.version }}"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: work/VethuQ
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\vethuq"
          Start-Process -Wait dist\VethuQ-CLI-Setup.exe -ArgumentList "/VERYSILENT","/CURRENTUSER","/MERGETASKS=!addtopath","/DIR=$dir"
          & "$dir\vethuq.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $engines = & "$dir\vethuq.exe" search-engines list | Out-String
          Write-Host $engines
          foreach ($id in "like", "exact", "full-text") { if ($engines -notmatch $id) { throw "missing $id" } }
          if ($engines -match "fuzzy|lexical|proximity") { throw "an add-on that is not a default is installed" }
          # Uninstalling keeps the licences, the ledger and the data; a reinstall finds them (#187).
          $device = "$env:PROGRAMDATA\VethuQ"
          $data = "$env:LOCALAPPDATA\VethuQ"
          New-Item -ItemType Directory -Force "$device", "$data\models" | Out-Null
          Set-Content "$device\device.db" "ledger"
          Set-Content "$data\models\model.bin" "model"
          Start-Process -Wait "$dir\unins000.exe" -ArgumentList "/VERYSILENT"
          if (Test-Path "$dir\vethuq.exe") { throw "the uninstall left the program behind" }
          if (-not (Test-Path "$device\device.db")) { throw "the uninstall removed the ledger" }
          if (-not (Test-Path "$data\models\model.bin")) { throw "the uninstall removed the models" }
          Start-Process -Wait dist\VethuQ-CLI-Setup.exe -ArgumentList "/VERYSILENT","/CURRENTUSER","/MERGETASKS=!addtopath","/DIR=$dir"
          if (-not (Test-Path "$device\device.db")) { throw "the reinstall lost the ledger" }
          # Full removal, silently.
          Start-Process -Wait "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/REMOVEDATA=1"
          if (Test-Path "$dir\vethuq.exe") { throw "the full removal left the program behind" }
          if (Test-Path "$device") { throw "the full removal left the device folder" }
          if (Test-Path "$data") { throw "the full removal left the data folder" }
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        working-directory: work/VethuQ
        run: |
          sudo dpkg -i dist/*.deb
          vethuq --version
          engines="$(vethuq search-engines list)"
          echo "$engines"
          for id in like exact full-text; do echo "$engines" | grep -q "$id"; done
          ! echo "$engines" | grep -Eq "fuzzy|lexical|proximity"
          sudo dpkg -r vethuq-cli
          test ! -e /usr/bin/vethuq

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: work/VethuQ/dist/*
          if-no-files-found: error

  github-release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ needs.plan.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" \
            --title "VethuQ command line ${{ needs.plan.outputs.version }}" \
            --notes "The VethuQ command line (no desktop app). Windows: run VethuQ-CLI-Setup.exe. Linux (Debian, Ubuntu): sudo apt install ./vethuq-cli_*.deb. Installs the default add-ons; see docs/releasing.md."
