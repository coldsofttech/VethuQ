# Virtual workspace root: not a distribution, never built or published.
# The distributions live under packages/ (VethuQ in packages/core, vethuq-addon-api in
# packages/addon-api).
[project]
name = "vethuq-workspace"
version = "0.1.0"
description = "uv workspace root for VethuQ — open-source document intelligence and evidence infrastructure (not published)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]
# The free add-ons (English, PDF, text, CSV, Markdown, Paddle, quick OCR) are built in the premium repository; resolve them from a sibling checkout until they are
# from its own workspace; use this workspace's copy.
override-dependencies = ["vethuq-addon-api~=0.1"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
VethuQ = { workspace = true }
vethuq-addon-api = { workspace = true }
vethuq-worker = { workspace = true }
vethuq-api = { workspace = true }
vethuq-desktop = { workspace = true }
# English is built in the premium repository; resolve it from a sibling checkout until it is
# published (clone VethuQ and VethuQ-premium next to each other).
