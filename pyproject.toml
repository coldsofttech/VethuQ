# Virtual workspace root: not a distribution, never built or published.
# The distributions live under packages/ (VethuQ in packages/core, vethuq-addon-api in
# packages/addon-api).
[project]
name = "vethuq-workspace"
version = "0.1.0"
description = "uv workspace root for VethuQ — open-source document intelligence and evidence infrastructure (not published)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]
# The free add-ons (English, PDF, Paddle, quick OCR) are built in the premium repository; resolve them from a sibling checkout until they are
# from its own workspace; use this workspace's copy.
override-dependencies = ["vethuq-addon-api~=0.1"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
VethuQ = { workspace = true }
vethuq-addon-api = { workspace = true }
vethuq-worker = { workspace = true }
# English is built in the premium repository; resolve it from a sibling checkout until it is
# published (clone VethuQ and VethuQ-premium next to each other).
vethuq-addon-english = { path = "../VethuQ-premium/packages/languages/english" }
vethuq-addon-pdf = { path = "../VethuQ-premium/packages/file-types/pdf" }
vethuq-addon-paddle = { path = "../VethuQ-premium/packages/ocr/engines/paddle" }
vethuq-addon-ocr-quick = { path = "../VethuQ-premium/packages/ocr/modes/quick" }
vethuq-addon-github = { path = "../VethuQ-premium/packages/tiers/github" }
vethuq-addon-like = { path = "../VethuQ-premium/packages/search/engines/like" }
vethuq-addon-exact = { path = "../VethuQ-premium/packages/search/engines/exact" }
vethuq-addon-case = { path = "../VethuQ-premium/packages/search/normalisers/case" }
vethuq-addon-unicode = { path = "../VethuQ-premium/packages/search/normalisers/unicode" }

[dependency-groups]
dev = [
    "VethuQ",
    "vethuq-addon-api",
    "vethuq-worker",
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "jsonschema>=4.20",
    "pillow>=10",
    "pyyaml>=6",
    "pynacl>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/core/src", "packages/addon-api/src", "packages/worker/src", "packages/core", "tools", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603", "S607", "S108", "S105", "S106", "B018"]
"tools/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/addon-api/tests", "packages/worker/tests", "tools/policy/tests", "scripts"]
addopts = "-ra"
