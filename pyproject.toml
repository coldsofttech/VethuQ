# Virtual workspace root: not a distribution, never built or published.
# The distributions live under packages/ (VethuQ in packages/core, vethuq-addon-api in
# packages/addon-api).
[project]
name = "vethuq-workspace"
version = "0.1.0"
description = "uv workspace root for VethuQ — open-source document intelligence and evidence infrastructure (not published)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]
# The free add-ons (English, PDF, text, CSV, Markdown, Paddle, quick OCR) are built in the premium repository; resolve them from a sibling checkout until they are
# from its own workspace; use this workspace's copy.
override-dependencies = ["vethuq-addon-api~=0.1"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
VethuQ = { workspace = true }
vethuq-addon-api = { workspace = true }
vethuq-worker = { workspace = true }
vethuq-api = { workspace = true }
vethuq-desktop = { workspace = true }
# English is built in the premium repository; resolve it from a sibling checkout until it is
# published (clone VethuQ and VethuQ-premium next to each other).
vethuq-addon-english = { path = "../VethuQ-premium/packages/add-ons/languages/english" }
vethuq-addon-pdf = { path = "../VethuQ-premium/packages/add-ons/file-types/pdf" }
vethuq-addon-txt = { path = "../VethuQ-premium/packages/add-ons/file-types/txt" }
vethuq-addon-csv = { path = "../VethuQ-premium/packages/add-ons/file-types/csv" }
vethuq-addon-markdown = { path = "../VethuQ-premium/packages/add-ons/file-types/markdown" }
vethuq-addon-png = { path = "../VethuQ-premium/packages/add-ons/file-types/png" }
vethuq-addon-jpg = { path = "../VethuQ-premium/packages/add-ons/file-types/jpg" }
vethuq-addon-tiff = { path = "../VethuQ-premium/packages/add-ons/file-types/tiff" }
vethuq-bundle-search = { path = "../VethuQ-premium/packages/bundles/search" }
vethuq-bundle-image = { path = "../VethuQ-premium/packages/bundles/image" }
vethuq-addon-ocr-moderate = { path = "../VethuQ-premium/packages/add-ons/ocr/modes/moderate" }
vethuq-addon-ocr-deep = { path = "../VethuQ-premium/packages/add-ons/ocr/modes/deep" }
vethuq-bundle-deep-scan = { path = "../VethuQ-premium/packages/bundles/deep-scan" }
vethuq-addon-html = { path = "../VethuQ-premium/packages/add-ons/file-types/html" }
vethuq-addon-xml = { path = "../VethuQ-premium/packages/add-ons/file-types/xml" }
vethuq-addon-css = { path = "../VethuQ-premium/packages/add-ons/file-types/css" }
vethuq-addon-js = { path = "../VethuQ-premium/packages/add-ons/file-types/js" }
vethuq-addon-json = { path = "../VethuQ-premium/packages/add-ons/file-types/json" }
vethuq-addon-yaml = { path = "../VethuQ-premium/packages/add-ons/file-types/yaml" }
vethuq-addon-docx = { path = "../VethuQ-premium/packages/add-ons/file-types/docx" }
vethuq-addon-doc = { path = "../VethuQ-premium/packages/add-ons/file-types/doc" }
vethuq-addon-xlsx = { path = "../VethuQ-premium/packages/add-ons/file-types/xlsx" }
vethuq-addon-xls = { path = "../VethuQ-premium/packages/add-ons/file-types/xls" }
vethuq-addon-pptx = { path = "../VethuQ-premium/packages/add-ons/file-types/pptx" }
vethuq-addon-ppt = { path = "../VethuQ-premium/packages/add-ons/file-types/ppt" }
vethuq-addon-rtf = { path = "../VethuQ-premium/packages/add-ons/file-types/rtf" }
vethuq-addon-eml = { path = "../VethuQ-premium/packages/add-ons/file-types/eml" }
vethuq-bundle-office = { path = "../VethuQ-premium/packages/bundles/office" }
vethuq-bundle-developer = { path = "../VethuQ-premium/packages/bundles/developer" }
vethuq-bundle-web = { path = "../VethuQ-premium/packages/bundles/web" }
vethuq-addon-paddle = { path = "../VethuQ-premium/packages/add-ons/ocr/engines/paddle" }
vethuq-addon-ocr-quick = { path = "../VethuQ-premium/packages/add-ons/ocr/modes/quick", editable = true }
vethuq-addon-github = { path = "../VethuQ-premium/packages/add-ons/tiers/github" }
vethuq-addon-like = { path = "../VethuQ-premium/packages/add-ons/search/engines/like", editable = true }
vethuq-addon-exact = { path = "../VethuQ-premium/packages/add-ons/search/engines/exact", editable = true }
vethuq-addon-lexical = { path = "../VethuQ-premium/packages/add-ons/search/engines/lexical", editable = true }
vethuq-addon-full-text = { path = "../VethuQ-premium/packages/add-ons/search/engines/full-text", editable = true }
vethuq-addon-proximity = { path = "../VethuQ-premium/packages/add-ons/search/engines/proximity", editable = true }
vethuq-addon-fuzzy = { path = "../VethuQ-premium/packages/add-ons/search/engines/fuzzy", editable = true }
vethuq-addon-noise-fuzzy = { path = "../VethuQ-premium/packages/add-ons/search/engines/noise-fuzzy", editable = true }
vethuq-addon-semantic = { path = "../VethuQ-premium/packages/add-ons/search/engines/semantic", editable = true }
vethuq-addon-case = { path = "../VethuQ-premium/packages/add-ons/search/normalisers/case", editable = true }
vethuq-addon-unicode = { path = "../VethuQ-premium/packages/add-ons/search/normalisers/unicode", editable = true }
vethuq-addon-leetspeak = { path = "../VethuQ-premium/packages/add-ons/search/normalisers/leetspeak", editable = true }

[dependency-groups]
dev = [
    "VethuQ",
    # Not installed with VethuQ by default, but the tests exercise them.
    "vethuq-addon-lexical",
    "vethuq-addon-proximity",
    "vethuq-addon-fuzzy",
    "vethuq-addon-noise-fuzzy",
    "vethuq-addon-leetspeak",
    "vethuq-addon-semantic",
    "numpy>=1.26",
    "vethuq-addon-api",
    "vethuq-worker",
    "vethuq-api",
    "vethuq-desktop",
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "jsonschema>=4.20",
    "pillow>=10",
    "pyyaml>=6",
    "pynacl>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/core/src", "packages/addon-api/src", "packages/worker/src", "packages/api/src", "packages/desktop/src", "packages/core", "tools", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603", "S607", "S108", "S105", "S106", "B018"]
"tools/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/addon-api/tests", "packages/worker/tests", "packages/api/tests", "packages/desktop/tests", "tools/policy/tests", "scripts"]
addopts = "-ra -m \"not integration\""
markers = [
    "integration: end-to-end tests that need real engines or network (run by integration.yml only)",
    "lang_en: integration tests of English files",
    "lang_te: integration tests of Telugu files",
    "type_pdf: integration tests of PDF files",
    "type_png: integration tests of PNG files",
    "type_jpg: integration tests of JPG files",
]
