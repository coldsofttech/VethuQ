[project]
name = "vethuq-workspace"
version = "0.1.0"
description = "VethuQ workspace root — not published; see packages/ for installable distributions"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
vethuq-core = { workspace = true }
vethuq-cli = { workspace = true }
vethuq-ui = { workspace = true }
# Remaining workspace packages (vethuq-entitlements, vethuq-intelligence,
# vethuq-security, vethuq-sdk, vethuq-api, vethuq-mcp, vethuq-ai) are added
# here as they are built — see docs/architecture.md for the planned package map.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "paddleocr.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages"]
