[project]
name = "vethuq-workspace"
version = "0.1.0"
description = "VethuQ workspace root — not published; see packages/ for installable distributions"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
vethuq = { workspace = true }
vethuq-core = { workspace = true }
vethuq-cli = { workspace = true }
vethuq-ui = { workspace = true }
vethuq-type-png = { workspace = true }
vethuq-type-jpg = { workspace = true }
vethuq-lang-te = { workspace = true }
vethuq-search-exact = { workspace = true }
vethuq-search-full-text = { workspace = true }
vethuq-search-fuzzy = { workspace = true }
vethuq-search-lexical = { workspace = true }
vethuq-search-noise-fuzzy = { workspace = true }
vethuq-search-proximity = { workspace = true }
# Remaining workspace packages (vethuq-entitlements, vethuq-intelligence,
# vethuq-security, vethuq-sdk, vethuq-api, vethuq-mcp, vethuq-ai) are added
# here as they are built — see docs/architecture.md for the planned package map.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-psutil>=5.9",
    # Marker packages: enable PNG/JPEG, the non-default search engines and the extra OCR
    # languages in the dev environment like the type-*, search-* and lang-* extras do.
    "vethuq-type-png",
    "vethuq-type-jpg",
    "vethuq-lang-te",
    "vethuq-search-exact",
    "vethuq-search-full-text",
    "vethuq-search-fuzzy",
    "vethuq-search-lexical",
    "vethuq-search-noise-fuzzy",
    "vethuq-search-proximity",
]

# For scripts/dev/generate_icons.py only - opt-in via
# `uv sync --group icons`, not part of the default `dev` group CI installs,
# since reportlab needs FreeType headers to build from source on Linux.
icons = [
    "svglib==1.5.1",
    "reportlab==3.6.13",
]

# For scripts/dev/release.py --desktop only - opt-in via
# `uv sync --group desktop`. Windows-only (the desktop build itself is
# Windows-only for now), so not part of the default `dev` group.
desktop = [
    "pyinstaller>=6.10; sys_platform == 'win32'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
platform = "linux"
# Each package has its own tests/conftest.py; mypy rejects the duplicate module name.
exclude = ["conftest\\.py$"]
# Tests import helpers from vethuq-core's conftest; resolve `conftest` to that one.
mypy_path = ["packages/vethuq-core/tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["paddleocr.*", "paddlex.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages"]
markers = [
    "integration: runs real fixture files, some with real PaddleOCR; run by integration.yml, not test.yml",
    "lang_en: integration test on English files (selected by the integration workflow's lang input)",
    "lang_te: integration test on Telugu files (selected by the integration workflow's lang input)",
    "type_pdf: integration test on PDF files (selected by the integration workflow's file-type input)",
    "type_png: integration test on PNG files (selected by the integration workflow's file-type input)",
    "type_jpg: integration test on JPG files (selected by the integration workflow's file-type input)",
]
